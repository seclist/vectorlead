name: "🐛 Bug Report"
description: "File a bug report to help us improve VectorLead."
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: input
    id: version
    attributes:
      label: "VectorLead Version"
      description: "Run `python main.py --help` or check `pyproject.toml`."
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - "Linux (Ubuntu/Debian/Arch)"
        - "macOS (Apple Silicon)"
        - "macOS (Intel)"
        - "Windows 11"
        - "Windows 10"
        - "Docker"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: "Python Version"
      placeholder: "3.11.9"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Exact CLI commands and steps to reproduce the issue."
      placeholder: |
        1. Run `python main.py hunt --niche personal_trainer`
        2. Encounter error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Terminal Logs / Traceback"
      description: "Copy and paste terminal output or traceback here."
      render: shell
